databases:
  - name: prarthanas-db
    databaseName: prarthanas
    user: prarthanas
    plan: free

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: prarthanas-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prarthanas-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OTP_TTL_SECONDS
        value: "300"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_COMMISSION_PERCENT
        value: "15"
      - key: DEFAULT_CURRENCY
        value: INR

  # ── Web (marketing site at / + Expo app at /app) ────────────
  - type: web
    name: prarthanas-web
    env: static
    buildCommand: pnpm --filter @clique/mobile export:web && bash scripts/web-postbuild.sh
    staticPublishPath: apps/mobile/dist
    routes:
      # Expo SPA: serve app/index.html for all /app/* paths
      - type: rewrite
        source: /app
        destination: /app/index.html
      - type: rewrite
        source: /app/*
        destination: /app/index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
